<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}911 Deal Radar{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper:   '#efeae0',
                        paper2:  '#e5dfd2',
                        ink:     '#15140f',
                        ink2:    '#2a2823',
                        muted:   '#847e72',
                        line:    '#d6cfc0',
                        red:  { DEFAULT: '#d5001c', dark: '#a40016' },
                        gold: '#c9a86b',
                        ok:   '#2f7d4a',
                    },
                    fontFamily: {
                        display: ['"Saira Condensed"', 'sans-serif'],
                        sans:    ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        mono:    ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
                    },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: 'Space Grotesk', system-ui, sans-serif; }
        .display { font-family: 'Saira Condensed', sans-serif; letter-spacing: -0.005em; text-transform: uppercase; }
        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: "tnum" 1; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { opacity: 0; animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) both; }

        [data-reveal] {
            opacity: 0; transform: translateY(16px);
            transition: opacity 0.6s cubic-bezier(.16,1,.3,1), transform 0.6s cubic-bezier(.16,1,.3,1);
        }
        [data-reveal].revealed { opacity: 1; transform: translateY(0); }

        .card-hover { transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease; }
        .card-hover:hover { transform: translateY(-2px); border-color: #d5001c !important; }

        /* Eyebrow / kicker mono label */
        .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #847e72; display: inline-flex; align-items: center; gap: 8px; }
        .eyebrow::before { content: ''; width: 6px; height: 6px; background: #d5001c; display: inline-block; }

        /* Racing tape divider */
        .race-tape { display: flex; gap: 4px; height: 3px; }
        .race-tape > :nth-child(1) { flex: 1; background: #d5001c; }
        .race-tape > :nth-child(2) { width: 80px; background: #15140f; }
        .race-tape > :nth-child(3) { width: 8px; background: #d5001c; }

        input::placeholder, textarea::placeholder { color: #b5ad9c; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #15140f; }

        a.btn-primary { background: #d5001c; color: #fff; padding: 12px 22px; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; transition: background 0.2s ease; display: inline-block; }
        a.btn-primary:hover { background: #a40016; }
        a.btn-ink { background: #15140f; color: #efeae0; padding: 12px 22px; font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; font-family: 'JetBrains Mono', monospace; transition: background 0.2s ease; display: inline-block; }
        a.btn-ink:hover { background: #2a2823; }
    </style>
</head>
<body class="bg-paper text-ink min-h-screen">

    <nav id="site-nav" class="bg-paper/95 backdrop-blur border-b border-line px-8 py-5 sticky top-0 z-50 transition-shadow duration-200">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-8">
            <a href="/" class="flex items-center gap-3 text-ink">
                <svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true">
                    <rect x="0.5" y="0.5" width="39" height="39" fill="none" stroke="currentColor" stroke-width="1.2" />
                    <path d="M6 30 L6 10 L11 10 L11 30 Z" fill="currentColor" />
                    <path d="M16 10 L26 10 Q31 10 31 15 Q31 20 26 20 L21 20 L31 30 L24 30 L16 22 Z" fill="currentColor" />
                    <rect x="33" y="26" width="4" height="4" fill="#d5001c" />
                </svg>
                <span class="leading-none">
                    <span class="display block font-bold text-[17px] tracking-wider">Deal Radar</span>
                    <span class="mono block text-[9px] tracking-[0.18em] opacity-55 mt-0.5">911 · MARKET INTELLIGENCE</span>
                </span>
            </a>
            <div class="hidden md:flex items-center gap-9">
                <a href="/" class="text-[13px] font-medium text-ink hover:text-red transition-colors">Home</a>
                <a href="/submit" class="text-[13px] font-medium text-muted hover:text-ink transition-colors">Evaluate Listing</a>
                <a href="#how" class="text-[13px] font-medium text-muted hover:text-ink transition-colors">How it works</a>
                <a href="#coverage" class="text-[13px] font-medium text-muted hover:text-ink transition-colors">Coverage</a>
            </div>
            <a href="/submit" class="btn-ink">Evaluate ⇢</a>
        </div>
    </nav>

    {% block hero %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-line bg-ink text-paper">
        <div class="max-w-6xl mx-auto px-8 py-12 flex flex-wrap gap-8 justify-between items-end">
            <div>
                <div class="flex items-center gap-3">
                    <svg width="26" height="26" viewBox="0 0 40 40">
                        <rect x="0.5" y="0.5" width="39" height="39" fill="none" stroke="currentColor" stroke-width="1.2" />
                        <path d="M6 30 L6 10 L11 10 L11 30 Z" fill="currentColor" />
                        <path d="M16 10 L26 10 Q31 10 31 15 Q31 20 26 20 L21 20 L31 30 L24 30 L16 22 Z" fill="currentColor" />
                        <rect x="33" y="26" width="4" height="4" fill="#d5001c" />
                    </svg>
                    <span class="display font-bold text-[18px] tracking-wider">Deal Radar</span>
                </div>
                <p class="mono text-[10px] tracking-[0.18em] opacity-50 mt-4">INDEPENDENT MARKET TOOL · NOT AFFILIATED WITH ANY MANUFACTURER OR AUCTION HOUSE</p>
            </div>
            <p class="mono text-[11px] opacity-65 text-right">BUILT IN LOS ANGELES<br>v0.4 · MAY 2026</p>
        </div>
    </footer>

    <script>
        const revealObs = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const delay = parseInt(entry.target.dataset.delay || '0');
                    setTimeout(() => entry.target.classList.add('revealed'), delay);
                    revealObs.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('[data-reveal]').forEach(el => revealObs.observe(el));

        const navEl = document.getElementById('site-nav');
        window.addEventListener('scroll', () => {
            navEl.style.boxShadow = window.scrollY > 10 ? '0 1px 24px rgba(20,19,15,0.08)' : '';
        }, { passive: true });

        document.querySelectorAll('[data-bar-width]').forEach(el => {
            requestAnimationFrame(() => setTimeout(() => { el.style.width = el.dataset.barWidth; }, 250));
        });
        document.querySelectorAll('[data-bar-show]').forEach(el => {
            requestAnimationFrame(() => setTimeout(() => { el.style.opacity = '1'; }, 1100));
        });
    </script>
</body>
</html>

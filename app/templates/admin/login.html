{% extends "base.html" %}
{% block title %}Admin Login — 911 Deal Radar{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20">
    <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>
    {% if error %}
    <p class="text-red-600 text-sm mb-4 text-center">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/login" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" autofocus required
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-black" />
        </div>
        <button type="submit"
            class="w-full bg-black text-white py-2 rounded text-sm font-medium hover:bg-gray-800">
            Sign in
        </button>
    </form>
</div>
{% endblock %}
